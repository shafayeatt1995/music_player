[package]
name = "xorin-player"
version = "1.0.0"
edition = "2021"
authors = ["Xorin Team"]
description = "Lightweight, cross-platform, VLC-grade modern audio player in pure Rust"
license = "MIT OR Apache-2.0"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
rustfft = "6.2"
rtrb = "0.3"
rfd = "0.15"
walkdir = "2.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
ureq = { version = "2.12", features = ["tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
crossbeam-channel = "0.5"
libloading = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
