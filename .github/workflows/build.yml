name: Cross-Platform Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (M1/M2/M3/M4)
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: xorin-player
            output_name: xorin-player-macos-arm64
            use_cross: false

          # macOS Intel (x86_64)
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: xorin-player
            output_name: xorin-player-macos-x86_64
            use_cross: false

          # Windows Intel & AMD (x86_64)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: xorin-player.exe
            output_name: xorin-player-windows-x86_64.exe
            use_cross: false

          # Windows Snapdragon (ARM64)
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            binary_name: xorin-player.exe
            output_name: xorin-player-windows-arm64-snapdragon.exe
            use_cross: false

          # Linux Intel & AMD (x86_64)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: xorin-player
            output_name: xorin-player-linux-x86_64
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux audio and GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare build artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.output_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: dist/${{ matrix.output_name }}

  macos-universal:
    name: Build macOS Universal Binary (Intel + Apple Silicon)
    runs-on: macos-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xorin-player-macos-arm64
          path: ./arm64
      - uses: actions/download-artifact@v4
        with:
          name: xorin-player-macos-x86_64
          path: ./x86_64
      - name: Create Universal Binary with lipo
        run: |
          mkdir -p ./universal
          chmod +x ./arm64/xorin-player-macos-arm64 ./x86_64/xorin-player-macos-x86_64
          lipo -create -output ./universal/xorin-player-macos-universal ./arm64/xorin-player-macos-arm64 ./x86_64/xorin-player-macos-x86_64
      - name: Upload Universal Binary
        uses: actions/upload-artifact@v4
        with:
          name: xorin-player-macos-universal
          path: ./universal/xorin-player-macos-universal
