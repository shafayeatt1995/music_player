name: Cross-Platform Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (M1/M2/M3/M4)
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: xorin-player
            output_name: xorin-player-macos-arm64
            archive_ext: zip
            use_cross: false

          # macOS Intel (x86_64)
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: xorin-player
            output_name: xorin-player-macos-x86_64
            archive_ext: zip
            use_cross: false

          # Windows Intel & AMD (x86_64)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: xorin-player.exe
            output_name: xorin-player-windows-x86_64.exe
            archive_ext: exe
            use_cross: false

          # Windows Snapdragon (ARM64)
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            binary_name: xorin-player.exe
            output_name: xorin-player-windows-arm64-snapdragon.exe
            archive_ext: exe
            use_cross: false

          # Linux Intel & AMD (x86_64)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: xorin-player
            output_name: xorin-player-linux-x86_64
            archive_ext: tar.gz
            use_cross: false

          # Linux ARM64 (Raspberry Pi 4/5, Linux ARM)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: xorin-player
            output_name: xorin-player-linux-arm64
            archive_ext: tar.gz
            use_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux audio and GUI dependencies
        if: runner.os == 'Linux' && !matrix.use_cross
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross for cross-compilation
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Prepare build artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.output_name }}
          chmod +x dist/${{ matrix.output_name }} || true

          # Create distribution packages
          cd dist
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            zip "${{ matrix.output_name }}.zip" "${{ matrix.output_name }}"
          elif [ "${{ matrix.archive_ext }}" = "tar.gz" ]; then
            tar -czvf "${{ matrix.output_name }}.tar.gz" "${{ matrix.output_name }}"
          fi

          # Build .deb package on Linux x86_64
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            cd ..
            ./packaging/linux/build-deb.sh "dist/${{ matrix.output_name }}" "1.0.0" "amd64" "dist"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: dist/*
          retention-days: 7

  macos-universal:
    name: Build macOS Universal Binary & App Bundle (.app)
    runs-on: macos-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xorin-player-macos-arm64
          path: ./arm64
      - uses: actions/download-artifact@v4
        with:
          name: xorin-player-macos-x86_64
          path: ./x86_64
      - name: Create Universal Binary with lipo and package .app bundle
        run: |
          mkdir -p ./universal
          chmod +x ./arm64/xorin-player-macos-arm64 ./x86_64/xorin-player-macos-x86_64
          lipo -create -output ./universal/xorin-player-macos-universal ./arm64/xorin-player-macos-arm64 ./x86_64/xorin-player-macos-x86_64
          chmod +x ./universal/xorin-player-macos-universal
          
          # Create universal binary zip
          cd ./universal
          zip xorin-player-macos-universal.zip xorin-player-macos-universal
          cd ..

          # Create native macOS .app bundle with Info.plist & AppIcon
          ./packaging/macos/bundle-macos.sh "./universal/xorin-player-macos-universal" "./universal"
      - name: Upload Universal Binary & App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: xorin-player-macos-universal
          path: ./universal/*
          retention-days: 7

  release:
    name: Publish GitHub Release with Assets
    runs-on: ubuntu-latest
    needs: [build, macos-universal]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-artifacts

      - name: Flatten and organize release files
        shell: bash
        run: |
          mkdir -p ./release-dist
          find ./release-artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.tar.gz" -o -name "*.deb" -o -name "xorin-player-linux*" -o -name "xorin-player-macos*" \) -exec cp {} ./release-dist/ \;
          ls -la ./release-dist

      - name: Generate Release Tag & Name
        id: release_meta
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            TITLE="Xorin Player ${TAG_NAME}"
            IS_PRERELEASE=false
          else
            TAG_NAME="continuous"
            TITLE="Xorin Player Continuous Build (Latest Main)"
            IS_PRERELEASE=true
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.title }}
          draft: false
          prerelease: ${{ steps.release_meta.outputs.is_prerelease == 'true' }}
          files: ./release-dist/*
          body: |
            ## 🎵 Xorin Player — High-Fidelity Audio & Cinema Video Player

            Welcome to the latest release of **Xorin Player**! Built with Rust and modern aesthetics, featuring studio-grade Poweramp audio processing, cinema video engine, and OS file associations.

            ---

            ### ⚡ One-Line Quick Install (macOS & Linux)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/shafayeatt1995/music_player/main/install.sh | bash
            ```

            ---

            ### 📦 Download Assets for Your Platform

            | Platform / Architecture | Recommended Download | Description |
            | :--- | :--- | :--- |
            | 🍏 **macOS Disk Image (DMG)** | [`xorin-player-macos-universal.dmg`](#) | Native drag-and-drop installer for all Macs (Apple Silicon + Intel) |
            | 🍏 **macOS Universal App** | [`xorin-player-macos-app.zip`](#) | Native `.app` bundle with full Open-With & icon support |
            | 🍏 **macOS Universal Binary** | [`xorin-player-macos-universal.zip`](#) | Standalone command-line binary for all Macs |
            | 🐧 **Debian / Ubuntu** | [`xorin-player_1.0.0_amd64.deb`](#) | Native `.deb` package (App menu & right-click Open-With) |
            | 🐧 **Linux (x86_64)** | [`xorin-player-linux-x86_64.tar.gz`](#) | Standalone 64-bit Linux binary |
            | 🐧 **Linux ARM64** | [`xorin-player-linux-arm64.tar.gz`](#) | 64-bit ARM Linux (Raspberry Pi 4/5, Pine64) |
            | 🪟 **Windows (x86_64)** | [`xorin-player-windows-x86_64.exe`](#) | 64-bit Windows Intel & AMD |
            | 🪟 **Windows Snapdragon** | [`xorin-player-windows-arm64-snapdragon.exe`](#) | Native ARM64 for Snapdragon X Elite / Surface |

            ---

            ### 🚀 Installation & "Open With" Setup

            #### 🍏 macOS (Homebrew or App Bundle)
            **Option A: Install via Homebrew**
            ```bash
            brew install --cask https://raw.githubusercontent.com/shafayeatt1995/music_player/main/packaging/homebrew/xorin-player.rb
            ```

            **Option B: Manual Download**
            1. Download `xorin-player-macos-app.zip` and unzip it.
            2. Move `Xorin Player.app` to your `/Applications` folder.
            3. Right-click any song or video ➜ **Open With** ➜ **Xorin Player**.

            #### 🐧 Linux (Debian / Ubuntu / Raspberry Pi)
            **Option A: Install `.deb` package (System integration & Open With)**
            ```bash
            sudo dpkg -i xorin-player_1.0.0_amd64.deb
            # or with apt:
            sudo apt install ./xorin-player_1.0.0_amd64.deb
            ```
            *Xorin Player will now show in your desktop app menu and in Right-Click ➜ **Open With** for all audio/video files!*

            **Option B: Standalone Tarball**
            ```bash
            tar -xzvf xorin-player-linux-x86_64.tar.gz
            sudo mv xorin-player-linux-x86_64 /usr/local/bin/xorin-player
            ```

            #### 🪟 Windows (Intel/AMD & Snapdragon ARM64)
            1. Download `xorin-player-windows-x86_64.exe` (or `xorin-player-windows-arm64-snapdragon.exe` for Snapdragon ARM devices).
            2. Double-click the `.exe` file to launch **Xorin Player**. No installer needed!
            3. To associate media files: Right-click any MP3/MP4 ➜ **Open with** ➜ **Choose another app** ➜ select `xorin-player-windows-x86_64.exe`.

            ---
            *Enjoy music and videos with **Xorin Player**!*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
